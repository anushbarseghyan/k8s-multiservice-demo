apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: demo/api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - { name: DB_HOST, value: db }
            - { name: DB_PASSWORD, value: demo }
          # Liveness: shallow, never touches the DB. A slow/unready DB must NOT
          # get this container restarted.
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: true readiness. 503 until the asyncpg pool works, so the
          # ~15s STARTUP_DELAY window keeps this pod OUT of the api endpoints.
          # A failing readiness probe never restarts the pod, so a generous
          # window here is safe.
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app: api }
spec:
  selector: { app: api }
  ports:
    - port: 8000
      targetPort: 8000
